<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TotComic Wireframes v2</title>
<style>
  :root { --tc-blue:#185FA5; --tc-dark:#1f2937; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif; background:#e9ebee; -webkit-font-smoothing:antialiased; }

  /* ── PROTOTYPE TOOLBAR ── */
  .proto-toolbar {
    background:#fff; border-bottom:1px solid #d1d5db; padding:10px 20px;
    position:sticky; top:0; z-index:300;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
  }
  .proto-left { display:flex; align-items:center; gap:12px; }
  .proto-brand { font-weight:700; font-size:14px; color:#111827; }
  .view-toggle { display:flex; gap:3px; background:#f3f4f6; border-radius:8px; padding:3px; }
  .view-btn { padding:5px 12px; border-radius:6px; border:none; font-size:12px; cursor:pointer; font-weight:600; transition:all .15s; }
  .view-btn.active { background:var(--tc-blue); color:white; }
  .view-btn:not(.active) { background:transparent; color:#6b7280; }
  .nav-btns { display:flex; gap:4px; flex-wrap:wrap; }
  .nav-btn { padding:5px 12px; border-radius:6px; border:1px solid #d1d5db; font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .nav-btn.active { background:var(--tc-blue); color:white; border-color:var(--tc-blue); }
  .nav-btn:not(.active) { background:#f3f4f6; color:#111827; }

  /* ── WIREFRAME FRAME ──
     Frame has a defined height so wf-inner becomes the layout container.
     screen-content is the actual scroll area → position:sticky inside it WORKS.
  */
  .wf-frame {
    display:flex; justify-content:center;
    padding:20px;
    height:calc(100vh - 56px); /* 56px = toolbar */
    box-sizing:border-box;
  }
  .wf-inner {
    width:100%; height:100%;
    display:flex; flex-direction:column;   /* header / content / sticky-bar */
    background:white; border-radius:12px;
    border:1px solid #d1d5db;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    overflow:hidden; /* clips — children handle their own scroll */
  }
  .wf-inner.desktop { max-width:1440px; }
  .wf-inner.mobile  { max-width:390px;  }

  /* THE scroll container — position:sticky inside here is valid */
  #screen-content { flex:1; overflow-y:auto; overflow-x:hidden; }

  /* Sticky bottom bar — moved outside #screen-content by render() */
  .sticky-bar-bottom {
    flex-shrink:0; background:white;
    border-top:1px solid #e5e7eb;
    padding:14px 24px;
    display:flex; align-items:center; gap:14px;
    z-index:50; box-shadow:0 -2px 8px rgba(0,0,0,.06);
  }

  /* ── ACCORDIONS ── */
  .acc-group { border-bottom:1px solid #e5e7eb; }
  .acc-header {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; background:none; border:none; padding:13px 0;
    cursor:pointer; font-size:14px; font-weight:600; color:#111827; text-align:left; gap:8px;
  }
  .acc-header:hover { color:var(--tc-blue); }
  .acc-chevron { display:inline-block; transition:transform .22s ease; font-size:11px; color:#6b7280; flex-shrink:0; }
  .acc-chevron.open { transform:rotate(180deg); }
  .acc-body { overflow:hidden; max-height:0; transition:max-height .28s ease, opacity .2s ease; opacity:0; }
  .acc-body.open { max-height:600px; opacity:1; }
  .acc-inner { padding-bottom:12px; }

  /* Mobile outer filter accordion */
  .mob-filter-wrap { border-bottom:1px solid #e5e7eb; background:#f9fafb; }
  .mob-filter-trigger {
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding:14px 16px; background:none; border:none;
    font-size:15px; font-weight:700; color:#111827; cursor:pointer; text-align:left;
  }
  .mob-filter-trigger:active { background:#f3f4f6; }
  .mob-filter-body { overflow:hidden; max-height:0; transition:max-height .32s ease, opacity .22s ease; opacity:0; }
  .mob-filter-body.open { max-height:1400px; opacity:1; }

  /* Search suggestions */
  .sugg-wrap { background:var(--tc-dark); padding:8px 24px 16px; border-bottom:1px solid #374151; }
  .sugg-wrap.mobile { padding:8px 16px 14px; }
  .sugg-box { background:white; border-radius:8px; padding:12px 14px; max-width:560px; position:relative; }
  .sugg-close { position:absolute; top:10px; right:12px; background:none; border:none; font-size:18px; cursor:pointer; color:#6b7280; line-height:1; }
</style>
</head>
<body>

<!-- PROTOTYPE TOOLBAR -->
<div class="proto-toolbar">
  <div class="proto-left">
    <span class="proto-brand">TotComic · Wireframes</span>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-desktop" onclick="setView('desktop')">🖥 Desktop</button>
      <button class="view-btn"        id="btn-mobile"  onclick="setView('mobile')">📱 Móvil</button>
    </div>
  </div>
  <div class="nav-btns">
    <button class="nav-btn active" onclick="goTo('home')">Home</button>
    <button class="nav-btn" onclick="goTo('search')">Búsqueda</button>
    <button class="nav-btn" onclick="goTo('product')">Producto</button>
    <button class="nav-btn" onclick="goTo('cart')">Carrito</button>
    <button class="nav-btn" onclick="goTo('shipping')">Envío</button>
    <button class="nav-btn" onclick="goTo('payment')">Pago</button>
    <button class="nav-btn" onclick="goTo('confirm')">Confirmación</button>
    <button class="nav-btn" onclick="goTo('account')">Mi Cuenta</button>
  </div>
</div>

<!-- WIREFRAME CANVAS -->
<div class="wf-frame">
  <div class="wf-inner desktop" id="wireframe-inner">
    <div id="screen-content"></div>
    <!-- sticky-bar-bottom injected here by render() when needed -->
  </div>
</div>

/* ══════════════════ HELPERS ══════════════════ */
function isM() { return currentView === 'mobile'; }
function px()  { return isM() ? '16px' : '32px'; }

function note(text, color) {
  var m = {blue:'#dbeafe|#1e40af', green:'#dcfce7|#15803d', orange:'#fed7aa|#c2410c', purple:'#ede9fe|#6d28d9'};
  var p = (m[color]||m.blue).split('|');
  return '<div style="display:inline-flex;align-items:center;gap:5px;background:'+p[0]+';color:'+p[1]+';border:1px solid '+p[1]+';border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;margin:6px 0 4px;">⚡ '+text+'</div>';
}
function badge(label, bg, col) {
  return '<span style="background:'+bg+';color:'+col+';font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;">'+label+'</span>';
}
function card(i, title, sub, price) {
  return '<div style="flex-shrink:0;width:'+(isM()?'148px':'190px')+';">'
    +'<div style="background:#e5e7eb;aspect-ratio:3/4;border-radius:8px;margin-bottom:10px;position:relative;">'
    +'<span style="position:absolute;top:8px;right:8px;background:#ef4444;color:white;font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;">-20%</span></div>'
    +'<div style="font-size:14px;font-weight:600;color:#111827;">'+(title||'Título del Cómic '+i)+'</div>'
    +'<div style="font-size:13px;color:#4b5563;margin-top:2px;">'+(sub||'Autor')+'</div>'
    +'<div style="font-size:15px;font-weight:700;color:#111827;margin-top:6px;">€'+(price||(12.99+i).toFixed(2))+'</div>'
    +'</div>';
}
function gridCard() {
  return '<div><div style="background:#e5e7eb;aspect-ratio:3/4;border-radius:8px;margin-bottom:8px;position:relative;">'
    +'<span style="position:absolute;top:6px;right:6px;background:#ef4444;color:white;font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;">-20%</span></div>'
    +'<div style="font-size:14px;font-weight:600;color:#111827;">Batman: DKR</div>'
    +'<div style="font-size:13px;color:#4b5563;">Frank Miller</div>'
    +'<div style="font-size:15px;font-weight:700;color:#111827;margin-top:4px;">€19.99</div>'
    +'<div style="font-size:13px;color:#15803d;margin-top:2px;">✓ En stock</div></div>';
}
function cbList(items) {
  return items.map(function(p){
    return '<label style="display:flex;align-items:center;gap:10px;font-size:14px;color:#111827;margin-bottom:10px;cursor:pointer;">'
      +'<input type="checkbox" style="width:16px;height:16px;accent-color:#185FA5;flex-shrink:0;" />'+p+'</label>';
  }).join('');
}
function fField(label, ph, type, span) {
  return '<div style="'+(span?'grid-column:1/-1;':'')+'">'
    +'<label style="display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:6px;">'+label+'</label>'
    +'<input type="'+(type||'text')+'" placeholder="'+ph+'" style="width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 14px;font-size:15px;color:#111827;" readonly />'
    +'</div>';
}

/* ══════════════════ ACCORDION ══════════════════ */
function toggleAcc(id) {
  var b=document.getElementById('acc-body-'+id), c=document.getElementById('acc-chev-'+id);
  if(!b||!c) return;
  var o=b.classList.contains('open');
  b.classList.toggle('open',!o); c.classList.toggle('open',!o);
}
function toggleMobF() {
  var b=document.getElementById('mob-f-body'), c=document.getElementById('mob-f-chev');
  if(!b||!c) return;
  var o=b.classList.contains('open');
  b.classList.toggle('open',!o); c.classList.toggle('open',!o);
}
function accG(id, label, html) {
  return '<div class="acc-group">'
    +'<button class="acc-header" onclick="toggleAcc(\''+id+'\')">'+label
    +'<span class="acc-chevron" id="acc-chev-'+id+'">▼</span></button>'
    +'<div class="acc-body" id="acc-body-'+id+'"><div class="acc-inner">'+html+'</div></div></div>';
}

/* ══════════════════ SEARCH ══════════════════ */
function openSearch() {
  searchOpen = true;
  if (currentScreen !== 'search') {
    currentScreen = 'search';
    document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
    document.querySelectorAll('.nav-btn')[1].classList.add('active');
  }
  render();
}
function closeSearch() { searchOpen = false; render(); }

function suggPanel() {
  if (!searchOpen) return '';
  var isM2=isM();
  return '<div class="sugg-wrap'+(isM2?' mobile':'')+'">'
    +'<div class="sugg-box">'
    +'<button class="sugg-close" onclick="closeSearch()">✕</button>'
    +'<div style="font-size:13px;color:#4b5563;margin-bottom:8px;font-weight:500;">Sugerencias</div>'
    +'<div style="font-size:15px;padding:8px 10px;border-radius:6px;background:#f3f4f6;margin-bottom:4px;cursor:pointer;color:#111827;"><strong>Batman:</strong> The Dark Knight Returns</div>'
    +'<div style="font-size:15px;padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;color:#111827;"><strong>Batman:</strong> Year One</div>'
    +'<div style="font-size:15px;padding:8px 10px;border-radius:6px;cursor:pointer;color:#111827;"><strong>Batman:</strong> No Man\'s Land</div>'
    +'</div>'
    +note('Sugerencias en tiempo real — solo aparecen al escribir en el buscador','blue')
    +'</div>';
}

/* ══════════════════ SHARED COMPONENTS ══════════════════ */

/* FIX 1 + FIX 2: Header sticky en TODAS las pantallas. Móvil: 2 filas para evitar que el buscador se corte */
function header(isCheckout) {
  var mob = isM();

  if (isCheckout) {
    return '<header style="background:#1f2937;padding:14px 24px;position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;">'
      +LOGO
      +(!mob?'<span style="color:#9ca3af;font-size:14px;">🔒 Proceso de compra seguro</span>':'')
      +'<div style="position:relative;">'
      +'<span style="font-size:22px;color:white;">🛒</span>'
      +'<span style="position:absolute;top:-6px;right:-8px;background:#3b82f6;color:white;font-size:12px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;">2</span>'
      +'</div></header>';
  }

  if (mob) {
    /* MOBILE: 2 rows — row1: hamburger+logo+cart / row2: full-width search */
    return '<header style="background:#1f2937;padding:12px 16px;position:sticky;top:0;z-index:40;">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
      +'<div style="display:flex;align-items:center;gap:10px;">'
      +'<button style="color:white;font-size:22px;cursor:pointer;background:none;border:none;line-height:1;padding:0;" aria-label="Menú">☰</button>'
      +LOGO+'</div>'
      +'<div style="position:relative;">'
      +'<button style="background:none;border:none;cursor:pointer;padding:0;" aria-label="Carrito">'
      +'<span style="font-size:22px;color:white;">🛒</span>'
      +'<span style="position:absolute;top:-6px;right:-8px;background:#3b82f6;color:white;font-size:12px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;">2</span>'
      +'</button></div></div>'
      +'<div onclick="openSearch()" style="display:flex;align-items:center;gap:8px;background:white;border-radius:8px;padding:9px 14px;width:100%;cursor:text;">'
      +'<span style="color:#6b7280;flex-shrink:0;">🔍</span>'
      +'<span style="font-size:15px;color:#9ca3af;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Buscar cómics, autores…</span>'
      +'</div></header>';

/* ══════════════════ RENDER ENGINE ══════════════════
   After rendering, extracts .sticky-bar-bottom from
   #screen-content and appends it to #wireframe-inner
   so it lives OUTSIDE the scroll area → always visible.
════════════════════════════════════════════════════ */
function render() {
  var fn = screens[currentScreen];
  if (!fn) return;

  var inner   = document.getElementById('wireframe-inner');
  var content = document.getElementById('screen-content');

  /* Remove any previous sticky bar */
  var prev = inner.querySelector('.sticky-bar-bottom');
  if (prev) prev.remove();

  content.innerHTML = fn();

  /* Extract sticky bar to wf-inner (outside scroll) */
  var bar = content.querySelector('.sticky-bar-bottom');
  if (bar) inner.appendChild(bar);

  /* Mobile product page: show sticky bar only when inline button scrolled out of view */
  if (currentScreen === 'product' && currentView === 'mobile') {
    var stickyBar = document.getElementById('mobile-sticky-bar');
    var inlineBtn = document.getElementById('cart-btn-mobile-inline');
    var scrollArea = document.getElementById('screen-content');
    if (stickyBar && inlineBtn) {
      scrollArea.addEventListener('scroll', function() {
        var rect = inlineBtn.getBoundingClientRect();
        var containerRect = scrollArea.getBoundingClientRect();
        var isVisible = rect.top < containerRect.bottom && rect.bottom > containerRect.top;
        stickyBar.style.display = isVisible ? 'none' : 'flex';
      });
    }
  }
}

/* ══════════════════ NAVIGATION ══════════════════ */
function setView(v) {
  currentView = v;
  searchOpen = false;
  document.getElementById('wireframe-inner').className = 'wf-inner ' + v;
  document.getElementById('btn-desktop').className = 'view-btn'+(v==='desktop'?' active':'');
  document.getElementById('btn-mobile').className  = 'view-btn'+(v==='mobile' ?' active':'');
  render();
}

function goTo(screen) {
  currentScreen = screen;
  searchOpen = false;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var idx={home:0,search:1,product:2,cart:3,shipping:4,payment:5,confirm:6,account:7};
  var btns=document.querySelectorAll('.nav-btn');
  if (btns[idx[screen]]) btns[idx[screen]].classList.add('active');
  render();
  document.getElementById('screen-content').scrollTop = 0;
}

render();
